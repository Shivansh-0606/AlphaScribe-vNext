<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AlphaScribe">
  <!--
    Provisional placeholder favicon (Phase 1 UX remediation).
    Non-figurative: the frozen brand gradient only (--brand-from -> --brand-to,
    docs/experience_design/02_Color_System.md), no invented logo mark — a
    logo/monogram is a Design-owned visual decision (§6.5) not Engineering's
    to originate. Replace with the approved logo export per the Asset Export
    Standards (docs/experience_design/engineering_handoff/08) when available.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#069169" />
      <stop offset="100%" stop-color="#0D8C82" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="8" fill="url(#brand)" />
</svg>
